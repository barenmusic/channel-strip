name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MyChannelStrip-${{ matrix.name }}-vst3
          path: build/ChannelStrip_artefacts/Release/VST3/
